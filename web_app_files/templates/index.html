<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pest Control Rover</title>
    
    <!-- Rover Icon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2322c55e' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Ccircle cx='12' cy='12' r='10'/%3E%3Cline x1='12' y1='2' x2='12' y2='22'/%3E%3Cline x1='2' y1='12' x2='22' y2='12'/%3E%3C/svg%3E">

    <style>
        :root {
            /* Light Green & White Theme Variables */
            --bg-color: #f0fdf4; /* Very light green */
            --panel-bg: #ffffff; /* Pure white for panels/widgets */
            --border-color: #22c55e; /* Vibrant Green */
            --accent-color: #16a34a; /* Darker Green for interactions */
            --text-color: #064e3b; /* Very dark green almost black */
            --text-muted: #64748b; /* Slate for labels */
            --alert-color: #ef4444; /* Alert Red */
            --warning-color: #f59e0b; /* Warning Amber */
            --font-main: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            --radius-smooth: 12px;
        }

        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-main);
            overflow: hidden; 
        }

        .hud-container {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
            box-sizing: border-box;
            padding: 16px;
            max-width: 1600px;
            margin: 0 auto;
            gap: 16px;
        }

        /* Top Header Area */
        .control-panel {
            background: var(--panel-bg);
            border: 1px solid rgba(34, 197, 94, 0.4);
            border-radius: var(--radius-smooth);
            padding: 12px 24px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            flex-shrink: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
        }

        .header-center {
            flex: 2;
            display: flex;
            justify-content: center;
        }

        .header-right {
            flex: 1;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 16px;
        }

        .icon-btn {
            background: transparent;
            border: 1px solid rgba(100, 116, 139, 0.3);
            color: var(--text-muted);
            padding: 8px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .icon-btn:hover {
            background: rgba(34, 197, 94, 0.1);
            color: var(--accent-color);
            border-color: var(--border-color);
        }
        
        .icon-btn.active {
            background: rgba(34, 197, 94, 0.2);
            color: var(--accent-color);
            border-color: var(--border-color);
        }

        .icon-btn svg {
            width: 18px;
            height: 18px;
            stroke: currentColor;
            stroke-width: 2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .main-title {
            font-weight: 800;
            font-size: 1.4rem;
            letter-spacing: 1px;
            color: var(--accent-color);
            text-transform: uppercase;
            margin: 0;
        }

        /* Battery Indicator */
        .batt-container {
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 700;
            color: var(--text-color);
            background: #f1f5f9;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.85em;
            border: 1px solid #cbd5e1;
        }
        .batt-container svg {
            width: 18px;
            height: 18px;
            fill: var(--accent-color);
        }

        .status-container {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.85em;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .medical-spinner {
            width: 14px;
            height: 14px;
            border: 2px solid rgba(34, 197, 94, 0.2);
            border-top-color: var(--accent-color);
            border-radius: 50%;
            display: inline-block;
            animation: spin 1s linear infinite;
        }

        /* 2-Column Main Layout */
        .main-body {
            display: flex;
            flex: 1;
            gap: 16px;
            overflow: hidden;
        }

        /* Left Side: Camera Frame */
        .left-col {
            flex: 1;
            display: flex;
            background: var(--panel-bg);
            border: 1px solid rgba(34, 197, 94, 0.4);
            border-radius: var(--radius-smooth);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            padding: 12px;
        }

        .feed-wrapper {
            position: relative;
            background: #e2e8f0;
            border-radius: 8px;
            flex: 1; 
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border: 1px solid #cbd5e1;
        }

        .feed-wrapper::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: 
                linear-gradient(rgba(34, 197, 94, 0.15) 1px, transparent 1px),
                linear-gradient(90deg, rgba(34, 197, 94, 0.15) 1px, transparent 1px);
            background-size: 40px 40px; 
            pointer-events: none;
            z-index: 0;
        }

        .feed-img {
            width: 100%;
            height: 100%;
            object-fit: contain; 
            display: block;
            z-index: 1;
        }

        .feed-img:not([src]), .feed-img[src=""] { opacity: 0; }

        .offline-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(248, 250, 252, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: var(--alert-color);
            font-weight: 700;
            letter-spacing: 1px;
            font-size: 1.1em;
            z-index: 2;
            animation: pulse-alert 2.5s infinite alternate;
        }

        .feed-label {
            position: absolute;
            top: 12px;
            left: 12px;
            background: rgba(255, 255, 255, 0.9);
            color: var(--text-color);
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 0.75em;
            font-weight: 700;
            letter-spacing: 1px;
            z-index: 3;
            border: 1px solid var(--border-color);
        }

        /* Right Side: Controllers & Widgets */
        .right-col {
            width: 380px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            overflow-y: auto;
            padding-right: 4px; 
        }

        .right-col::-webkit-scrollbar { width: 6px; }
        .right-col::-webkit-scrollbar-thumb { background: rgba(34, 197, 94, 0.3); border-radius: 3px; }

        .widget {
            background: var(--panel-bg);
            border: 1px solid rgba(34, 197, 94, 0.4);
            border-radius: var(--radius-smooth);
            padding: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        .widget-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            border-bottom: 1px solid #e2e8f0;
            padding-bottom: 8px;
        }

        .widget-title {
            font-weight: 700;
            font-size: 1rem;
            color: var(--text-color);
        }

        /* Action Widget */
        .action-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }

        .btn-start {
            background: var(--border-color);
            color: white;
            border: none;
            border-radius: 6px;
            padding: 10px 20px;
            font-size: 0.9em;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            flex: 1;
        }
        
        .btn-start:hover { background: var(--accent-color); box-shadow: 0 4px 12px rgba(34,197,94,0.3); }

        .btn-outline {
            background: transparent;
            border: 1px solid var(--text-muted);
            color: var(--text-muted);
            border-radius: 6px;
            padding: 8px 10px; /* Tighter padding for grid */
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85em; /* Scaled down slightly to fit columns */
            transition: all 0.2s ease;
            text-align: center;
        }
        .btn-outline:hover {
            border-color: var(--border-color);
            color: var(--border-color);
        }

        .btn-danger {
            background: rgba(239, 68, 68, 0.1);
            color: var(--alert-color);
            border: 1px solid rgba(239, 68, 68, 0.5);
            border-radius: 6px;
            padding: 8px 16px;
            cursor: pointer;
            font-weight: 600;
        }

        .status-text {
            font-size: 0.95em;
            font-weight: 600;
            color: var(--text-muted);
            flex: 1;
            text-align: right;
        }

        /* Terminal Widget */
        .terminal-box {
            background: #022c22;
            color: #a7f3d0;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.85em;
            height: 120px;
            overflow-y: auto;
            padding: 10px;
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        
        .terminal-box::-webkit-scrollbar { width: 6px; }
        .terminal-box::-webkit-scrollbar-thumb { background: rgba(167, 243, 208, 0.3); border-radius: 3px; }

        /* Manual Control Widget */
        .speed-control {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 16px;
        }
        .speed-control label {
            font-size: 0.9em;
            font-weight: 600;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
        }
        
        input[type=range] {
            accent-color: var(--border-color);
            width: 100%;
        }

        .d-pad-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 10px;
            padding: 10px;
        }

        .d-pad {
            display: grid;
            grid-template-columns: 50px 50px 50px;
            grid-template-rows: 50px 50px 50px;
            gap: 8px;
            opacity: 0.4;
            pointer-events: none; 
            transition: opacity 0.3s;
        }

        .d-pad.unlocked {
            opacity: 1;
            pointer-events: auto;
        }

        .shape-btn {
            background-color: var(--accent-color);
            width: 100%;
            height: 100%;
            cursor: pointer;
            transition: all 0.1s;
        }

        .shape-btn:active {
            background-color: var(--border-color);
            transform: scale(0.9);
        }

        .t-up { grid-column: 2; grid-row: 1; clip-path: polygon(50% 10%, 0% 100%, 100% 100%); }
        .t-down { grid-column: 2; grid-row: 3; clip-path: polygon(50% 90%, 0% 0%, 100% 0%); }
        .t-left { grid-column: 1; grid-row: 2; clip-path: polygon(10% 50%, 100% 0%, 100% 100%); }
        .t-right { grid-column: 3; grid-row: 2; clip-path: polygon(90% 50%, 0% 0%, 0% 100%); }
        .t-center { grid-column: 2; grid-row: 2; border-radius: 50%; }

        /* Toast Alerts Container */
        .toast-container {
            position: fixed;
            bottom: 24px;
            right: 24px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 1000;
        }

        .toast {
            min-width: 250px;
            padding: 14px 18px;
            border-radius: 8px;
            background: var(--panel-bg);
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            border-left: 5px solid var(--border-color);
            color: var(--text-color);
            font-weight: 600;
            font-size: 0.9em;
            display: flex;
            align-items: center;
            justify-content: space-between;
            animation: slideIn 0.3s ease-out forwards;
        }

        .toast.warning { border-left-color: var(--warning-color); }
        .toast.error { border-left-color: var(--alert-color); }

        /* Settings Modal Overlay */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(240, 253, 244, 0.8);
            display: none; 
            justify-content: center;
            align-items: center;
            z-index: 100;
            backdrop-filter: blur(4px);
        }
        
        .modal-content {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-smooth);
            width: 500px;
            max-width: 90%;
            padding: 24px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        
        .modal-header {
            font-size: 1.2em;
            font-weight: 700;
            border-bottom: 1px solid #e2e8f0;
            padding-bottom: 12px;
            color: var(--text-color);
            display: flex;
            justify-content: space-between;
        }
        
        .settings-container {
            max-height: 50vh;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding-right: 8px;
        }
        
        .setting-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f8fafc;
            padding: 10px 14px;
            border-radius: 6px;
            border: 1px solid #e2e8f0;
        }
        
        .setting-item label {
            font-size: 0.9em;
            font-weight: 600;
            color: var(--text-color);
            text-transform: capitalize;
        }
        
        .setting-item input[type="text"], .setting-item input[type="number"] {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 6px 10px;
            border-radius: 4px;
            font-family: monospace;
            width: 150px;
        }
        
        .modal-footer {
            display: flex;
            justify-content: space-between;
            border-top: 1px solid #e2e8f0;
            padding-top: 16px;
            margin-top: 8px;
        }
        
        .modal-footer .right-actions {
            display: flex;
            gap: 10px;
        }

        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes pulse-alert { 0% { opacity: 0.8; } 100% { opacity: 1; text-shadow: 0 0 8px rgba(239, 68, 68, 0.3); } }
        @keyframes slideIn { from { transform: translateX(120%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes fadeOut { to { opacity: 0; transform: translateX(120%); } }
    </style>
</head>
<body>

    <!-- Toast Popups Container -->
    <div id="toast-container" class="toast-container"></div>

    <div class="hud-container">
        
        <!-- TOP HEADER -->
        <header class="control-panel">
            <div class="header-left">
                <!-- Power -->
                <button class="icon-btn btn-power" onclick="powerOffSystem()" title="Power Off Rover">
                    <svg viewBox="0 0 24 24"><path d="M18.36 6.64a9 9 0 1 1-12.73 0"></path><line x1="12" y1="2" x2="12" y2="12"></line></svg>
                </button>
                <!-- Settings -->
                <button class="icon-btn" onclick="openSettings()" title="Rover Settings">
                    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
                </button>
                <!-- Live Feed Toggle -->
                <button class="icon-btn" id="btn-live" onclick="toggleLiveFeed()" title="Toggle Camera">
                    <svg viewBox="0 0 24 24"><polygon points="23 7 16 12 23 17 23 7"></polygon><rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect></svg>
                </button>
            </div>
            
            <div class="header-center">
                <span class="main-title">PEST CONTROL ROVER</span>
            </div>
            
            <div class="header-right">
                <!-- Battery Indicator -->
                <div class="batt-container" id="battery-indicator">
                    <svg viewBox="0 0 24 24"><rect x="2" y="7" width="16" height="10" rx="2" ry="2"></rect><line x1="22" y1="11" x2="22" y2="13"></line></svg>
                    <span id="batt-text">--%</span>
                </div>

                <div class="status-container">
                    <div class="medical-spinner" id="loader"></div>
                    <span id="ws_con" style="color: var(--text-muted);">CONNECTING...</span>
                </div>
            </div>
        </header>

        <!-- MAIN BODY 2 COLUMNS -->
        <div class="main-body">
            
            <!-- Left side: CAMERA -->
            <div class="left-col">
                <div class="feed-wrapper">
                    <div class="feed-label">Cam 1</div>
                    <img id="img-cam" class="feed-img">
                    <div id="offline-cam" class="offline-overlay">
                        NO VIDEO SIGNAL
                    </div>
                </div>
            </div>

            <!-- Right side: WIDGETS -->
            <div class="right-col">
                
                <!-- Widget 1: Action Status -->
                <div class="widget">
                    <div class="action-row">
                        <button id="btn-task" onclick="toggleTask()" class="btn-start">START TASK</button>
                        <span class="status-text" id="main-status">Rover Standby</span>
                    </div>
                </div>

                <!-- Widget 2: Terminal -->
                <div class="widget">
                    <div class="widget-header">
                        <span class="widget-title">Terminal Log</span>
                    </div>
                    <div class="terminal-box" id="terminal-box">
                        <div>> System initialized...</div>
                    </div>
                </div>

                <!-- Widget 3: Quick Actions (Grid Layout for Side-by-Side) -->
                <div class="widget">
                    <div class="widget-header">
                        <span class="widget-title">Quick Actions</span>
                    </div>
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                        <button class="btn-outline" onclick="sendAction('CALIBRATE_IR')">Calibrate IR</button>
                        <button class="btn-outline" onclick="sendAction('RESET_PLATFORM')">Reset Platform</button>
                        <button class="btn-outline" style="grid-column: span 2;" onclick="sendAction('TEST_LINE_FOLLOW')">Test Line Follow</button>
                        <button class="btn-outline" onclick="sendAction('TOGGLE_PUMP_1')">Toggle Pump 1</button>
                        <button class="btn-outline" onclick="sendAction('TOGGLE_PUMP_2')">Toggle Pump 2</button>
                    </div>
                </div>

                <!-- Widget 4: Manual Control -->
                <div class="widget">
                    <div class="widget-header">
                        <span class="widget-title">Manual Control</span>
                        <button class="icon-btn" id="lock-btn" onclick="toggleManualControl()">
                            <!-- Locked Icon initially -->
                            <svg id="icon-locked" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                            <!-- Unlocked Icon (hidden) -->
                            <svg id="icon-unlocked" style="display:none;" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 9.9-1"></path></svg>
                        </button>
                    </div>

                    <div class="speed-control">
                        <label>Max Speed: <span id="speed-val">50%</span></label>
                        <input type="range" id="speed-slider" min="1" max="100" value="50" oninput="updateSpeed(this.value)">
                    </div>

                    <div class="d-pad-container">
                        <div class="d-pad" id="d-pad">
                            <!-- JS binds down/up/leave events to these shapes -->
                            <div class="shape-btn t-up" 
                                onmousedown="sendRoverCmd('UP', 'PRESS')" onmouseup="sendRoverCmd('UP', 'RELEASE')" onmouseleave="sendRoverCmd('UP', 'RELEASE')"
                                ontouchstart="sendRoverCmd('UP', 'PRESS')" ontouchend="sendRoverCmd('UP', 'RELEASE')"></div>
                            
                            <div class="shape-btn t-left" 
                                onmousedown="sendRoverCmd('LEFT', 'PRESS')" onmouseup="sendRoverCmd('LEFT', 'RELEASE')" onmouseleave="sendRoverCmd('LEFT', 'RELEASE')"
                                ontouchstart="sendRoverCmd('LEFT', 'PRESS')" ontouchend="sendRoverCmd('LEFT', 'RELEASE')"></div>
                            
                            <div class="shape-btn t-center" 
                                onmousedown="sendRoverCmd('STOP', 'PRESS')" onmouseup="sendRoverCmd('STOP', 'RELEASE')" onmouseleave="sendRoverCmd('STOP', 'RELEASE')"
                                ontouchstart="sendRoverCmd('STOP', 'PRESS')" ontouchend="sendRoverCmd('STOP', 'RELEASE')"></div>
                            
                            <div class="shape-btn t-right" 
                                onmousedown="sendRoverCmd('RIGHT', 'PRESS')" onmouseup="sendRoverCmd('RIGHT', 'RELEASE')" onmouseleave="sendRoverCmd('RIGHT', 'RELEASE')"
                                ontouchstart="sendRoverCmd('RIGHT', 'PRESS')" ontouchend="sendRoverCmd('RIGHT', 'RELEASE')"></div>
                            
                            <div class="shape-btn t-down" 
                                onmousedown="sendRoverCmd('DOWN', 'PRESS')" onmouseup="sendRoverCmd('DOWN', 'RELEASE')" onmouseleave="sendRoverCmd('DOWN', 'RELEASE')"
                                ontouchstart="sendRoverCmd('DOWN', 'PRESS')" ontouchend="sendRoverCmd('DOWN', 'RELEASE')"></div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>
    
    <!-- Settings Modal -->
    <div id="settings-modal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                Rover Configurations
            </div>
            <div id="settings-content" class="settings-container">
                <div style="color: var(--text-muted); text-align: center; padding: 20px;">Waiting for configuration...</div>
            </div>
            <div class="modal-footer">
                <button class="btn-danger" onclick="restartSystem()">Reboot Rover</button>
                <div class="right-actions">
                    <button class="btn-outline" onclick="closeSettings()">Cancel</button>
                    <button class="btn-start" style="padding: 8px 16px;" onclick="saveSettings()">Apply Params</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const websocketAddress = `ws://${window.location.hostname}:8000`;
        let ws_status = document.getElementById("ws_con");
        let loader = document.getElementById("loader");
        
        let imgCam = document.getElementById("img-cam");
        let offlineCam = document.getElementById("offline-cam");
        let settingsContent = document.getElementById("settings-content");
        
        let websocket = null;
        let isLiveFeedActive = false; 
        let wasDisconnected = false;
        let latestSettingsData = null; 
        
        let lastReceivedCam = Date.now();
        const TIMEOUT_THRESHOLD = 10000; 

        // Manual Control State
        let isManualEnabled = false;
        let currentRoverSpeed = 50;

        function connectWS() {
            websocket = new WebSocket(websocketAddress);
            loader.style.display = "inline-block"; 

            websocket.onopen = function () {
                if (wasDisconnected) {
                    window.location.reload(); // Refresh webpage on reconnect
                    return;
                }
                ws_status.innerHTML = "ROVER ONLINE";
                ws_status.style.color = "var(--border-color)";
                loader.style.display = "none"; 
                
                websocket.send(JSON.stringify({"T": "GET_SETTINGS"}));
                
                let btn = document.getElementById("btn-live");
                isLiveFeedActive = true;
                btn.classList.add("active");
                camon();
            };

            websocket.onclose = function () {
                wasDisconnected = true; 
                ws_status.innerHTML = "SIGNAL LOST";
                ws_status.style.color = "var(--alert-color)";
                loader.style.display = "inline-block";
                
                isLiveFeedActive = false;
                document.getElementById("btn-live").classList.remove("active");
                
                offlineCam.style.display = "flex";
                imgCam.removeAttribute('src'); 
                
                setTimeout(connectWS, 5000);
            };

            websocket.onmessage = function (evt) {
                if (evt.data instanceof Blob) {
                    evt.data.text().then(processData);
                } else {
                    processData(evt.data);
                }

                function processData(data) {
                    try {
                        let parsedData = JSON.parse(data);
                        handle_rx_msg(parsedData);
                    } catch(e) {
                        let type = data.slice(0, 3);
                        
                        if (type === 'cam') {
                            lastReceivedCam = Date.now();
                            offlineCam.style.display = "none";
                            imgCam.src = "data:image/jpeg;base64," + data.slice(3);
                        } 
                    }
                }
            };
        }

        function handle_rx_msg(msg){
            if (msg.T == "STATUS"){
                document.getElementById('main-status').innerText = msg.DATA;
            }
            
            if (msg.T == "SETTINGS") {
                parseSettings(msg);
            }

            if (msg.T == "TER" && msg.D) {
                appendTerminal(msg.D);
            }

            // Battery JSON Handler
            if (msg.T == "BATT") {
                let bVal = msg.V;
                document.getElementById('batt-text').innerText = bVal + "%";
                
                if(bVal < 5) {
                    showAlert("Battery Dead! Please recharge immediately.", "error", "batt-alert");
                } else if(bVal < 25) {
                    showAlert("Battery Low. Consider recharging.", "warning", "batt-alert");
                } else {
                    hideAlert("batt-alert");
                }
            }

            // Alert JSON Handler (Obstacles)
            if (msg.T == "ALERT") {
                if (msg.D == "OBJ_DETECTED") {
                    showAlert("Please remove any obstacle in rover's path.", "error", "obs-alert");
                } else if (msg.D == "OBJ_CLEARED") {
                    hideAlert("obs-alert");
                }
            }
        }

        /* ----- Toast Popup Logic ----- */
        function showAlert(message, type, id) {
            let container = document.getElementById('toast-container');
            let existing = document.getElementById('toast-' + id);
            
            if (existing) {
                existing.querySelector('.toast-text').innerText = message;
                existing.className = 'toast ' + type;
                return;
            }
            
            let toast = document.createElement('div');
            toast.id = 'toast-' + id;
            toast.className = 'toast ' + type;
            toast.innerHTML = `<span class="toast-text">${message}</span>`;
            container.appendChild(toast);
        }

        function hideAlert(id) {
            let existing = document.getElementById('toast-' + id);
            if (existing) {
                existing.style.animation = "fadeOut 0.3s ease-out forwards";
                setTimeout(() => existing.remove(), 300);
            }
        }

        /* ----- Terminal Functionality ----- */
        function appendTerminal(text) {
            let term = document.getElementById("terminal-box");
            let line = document.createElement("div");
            line.innerText = "> " + text;
            term.appendChild(line);
            term.scrollTop = term.scrollHeight; // auto scroll up
        }

        /* ----- Quick Actions ----- */
        function sendAction(actionType) {
            if (websocket && websocket.readyState === WebSocket.OPEN) {
                websocket.send(JSON.stringify({"T": "ACTION", "CMD": actionType}));
                appendTerminal("Action Sent: " + actionType);
            }
        }

        /* ----- Manual Rover Control Functionality ----- */
        function toggleManualControl() {
            isManualEnabled = !isManualEnabled;
            let dPad = document.getElementById("d-pad");
            let iconLock = document.getElementById("icon-locked");
            let iconUnlock = document.getElementById("icon-unlocked");
            let lockBtn = document.getElementById("lock-btn");

            if(isManualEnabled) {
                dPad.classList.add("unlocked");
                iconLock.style.display = "none";
                iconUnlock.style.display = "block";
                lockBtn.classList.add("active");
                appendTerminal("Manual Control Enabled.");
            } else {
                dPad.classList.remove("unlocked");
                iconLock.style.display = "block";
                iconUnlock.style.display = "none";
                lockBtn.classList.remove("active");
                appendTerminal("Manual Control Disabled.");
            }

            // Transmit lock state to server
            if (websocket && websocket.readyState === WebSocket.OPEN) {
                websocket.send(JSON.stringify({
                    "T": "MCTRL_LOCK",
                    "ACTIVE": isManualEnabled
                }));
            }
        }

        function updateSpeed(val) {
            currentRoverSpeed = parseInt(val);
            document.getElementById("speed-val").innerText = currentRoverSpeed + "%";
        }

        // Single function for 4 triangles and center circle
        function sendRoverCmd(direction, action) {
            if (!isManualEnabled) return;
            
            // Send command over websocket
            if (websocket && websocket.readyState === WebSocket.OPEN) {
                let payload = {
                    "T": "MCTRL",
                    "DIR": direction,  // 'UP', 'DOWN', 'LEFT', 'RIGHT', 'STOP'
                    "ACT": action,     // 'PRESS', 'RELEASE'
                    "SPD": currentRoverSpeed
                };
                websocket.send(JSON.stringify(payload));
            }
        }

        /* ----- Standard Functions ----- */
        setInterval(() => {
            if (websocket && websocket.readyState === WebSocket.OPEN) {
                let now = Date.now();
                if (now - lastReceivedCam > TIMEOUT_THRESHOLD) {
                    offlineCam.style.display = "flex";
                    imgCam.removeAttribute('src');
                }
            }
        }, 1000);

        function camon() { 
            if (websocket && websocket.readyState === WebSocket.OPEN) {
                websocket.send(JSON.stringify({"T": "LIVE"})); 
            }
        }
        
        function toggleLiveFeed() {
            let btn = document.getElementById("btn-live");
            isLiveFeedActive = !isLiveFeedActive;
            
            if (isLiveFeedActive) {
                btn.classList.add("active");
                camon(); 
            } else {
                btn.classList.remove("active");
                camon(); 
            }
        }
        
        let isTaskRunning = false;

        function toggleTask() {
            if (websocket && websocket.readyState === WebSocket.OPEN) {
                let btn = document.getElementById("btn-task");
                isTaskRunning = !isTaskRunning;
                
                if (isTaskRunning) {
                    btn.innerText = "STOP TASK";
                    // Apply red danger styles directly
                    btn.style.backgroundColor = "rgba(239, 68, 68, 0.1)";
                    btn.style.color = "var(--alert-color)";
                    btn.style.borderColor = "var(--alert-color)";
                    
                    appendTerminal("Task initiated.");
                } else {
                    btn.innerText = "START TASK";
                    // Clear inline styles to revert back to default green CSS
                    btn.style.backgroundColor = ""; 
                    btn.style.color = "";
                    btn.style.borderColor = "";
                    
                    // websocket.send(JSON.stringify({"T": "STOP"})); // Send stop command
                    appendTerminal("Task stopped.");
                }
                websocket.send(JSON.stringify({"T": "START"}));
            } else {
                alert("Cannot Start/Stop: Rover is offline.");
            }
        }

        function powerOffSystem() {
            if(confirm("WARNING: Are you sure you want to power down the Rover system?")) {
                if (websocket && websocket.readyState === WebSocket.OPEN) {
                    websocket.send(JSON.stringify({"T": "POWER"}));
                    appendTerminal("System Power Down sent.");
                }
            }
        }

        function openSettings() {
            document.getElementById("settings-modal").style.display = "flex";
            if (websocket && websocket.readyState === WebSocket.OPEN) {
                websocket.send(JSON.stringify({"T": "GET_SETTINGS"}));
            }
        }
        
        function closeSettings() {
            document.getElementById("settings-modal").style.display = "none";
        }
        
        function parseSettings(msg) {
            latestSettingsData = msg; 
            settingsContent.innerHTML = ""; 
            
            let hasKeys = false;
            for (let key in msg) {
                if (key === 'T') continue; 
                
                hasKeys = true;
                let div = document.createElement('div');
                div.className = 'setting-item';
                
                let label = document.createElement('label');
                label.innerText = key.replace(/_/g, ' '); 
                
                let input = document.createElement('input');
                input.id = 'cfg-' + key;
                
                if (typeof msg[key] === 'boolean') {
                    input.type = 'checkbox';
                    input.checked = msg[key];
                } else if (typeof msg[key] === 'number') {
                    input.type = 'number';
                    input.value = msg[key];
                } else {
                    input.type = 'text';
                    input.value = msg[key];
                }
                
                div.appendChild(label);
                div.appendChild(input);
                settingsContent.appendChild(div);
            }
            
            if(!hasKeys) {
                settingsContent.innerHTML = '<div style="color: var(--text-muted); text-align: center;">No configuration parameters received.</div>';
            }
        }
        
        function saveSettings() {
            if (!latestSettingsData) return;
            
            for (let key in latestSettingsData) {
                if (key === 'T') continue;
                
                let input = document.getElementById('cfg-' + key);
                if (input) {
                    if (input.type === 'checkbox') {
                        latestSettingsData[key] = input.checked;
                    } else if (input.type === 'number') {
                        latestSettingsData[key] = Number(input.value);
                    } else {
                        latestSettingsData[key] = input.value;
                    }
                }
            }
            
            if (websocket && websocket.readyState === WebSocket.OPEN) {
                websocket.send(JSON.stringify(latestSettingsData));
                appendTerminal("Parameters applied.");
            }
            closeSettings();
        }

        function restartSystem() {
            if (confirm("Are you sure you want to REBOOT the rover?")) {
                if (websocket && websocket.readyState === WebSocket.OPEN) {
                    websocket.send(JSON.stringify({"T": "RESTART"}));
                    closeSettings(); 
                }
            }
        }

        // Initialize connection
        connectWS();
    </script>
</body>
</html>
